name: One-shot source migration

on:
  push:
    paths:
      - '.github/workflows/migrate-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact #271 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jaredwilder/unpublished-math-papers.git /tmp/papers
          mkdir -p source
          cp -R /tmp/papers/erdos271-stanley/. source/
          rm .github/workflows/migrate-source.yml
          git config user.name "Jared Wilder release migration"
          git config user.email "jared@jaredwilder.com"
          git add -A
          git commit -m "Migrate exact Erdős 271 Stanley-sequence source"
          git push
